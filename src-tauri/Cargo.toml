[package]
name = "agentmirror-desktop"
version = "0.1.0"
description = "AgentMirror desktop client"
authors = ["AgentMirror contributors"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
