name: Release desktop artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<package version>)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.artifacts.outputs.tag }}
    steps:
      - name: Check out repository and pinned core
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: |
          $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $command) {
            winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements
          }

          $nsis = Get-ChildItem `
            -Path @('C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS') `
            -Filter makensis.exe -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $nsis) {
            throw 'NSIS (makensis.exe) was not found after installation.'
          }
          $nsis.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Tauri backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify bundled Linux WSL service
        run: node scripts/verify-agentmirrord-resource.mjs

      - name: Build Windows installers
        run: npm run tauri build

      - name: Verify release has no application console
        run: node scripts/verify-windows-subsystem.mjs

      - name: Stage Windows release artifacts
        id: artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $bundle = Join-Path $PWD 'src-tauri\target\release\bundle'
          $release = Join-Path $PWD 'release'
          $portableDir = Join-Path $env:RUNNER_TEMP 'agentmirror-portable'
          New-Item -ItemType Directory -Force -Path $release, $portableDir | Out-Null

          $nsis = Get-ChildItem (Join-Path $bundle 'nsis\*.exe') -File |
            Select-Object -First 1
          if (-not $nsis) {
            throw 'Tauri did not produce an NSIS installer.'
          }
          Copy-Item $nsis.FullName (Join-Path $release "AgentMirror_${version}_x64-setup.exe")

          $msi = Get-ChildItem (Join-Path $bundle 'msi\*.msi') -File |
            Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName (Join-Path $release "AgentMirror_${version}_x64_en-US.msi")
          }

          $binary = Join-Path $PWD 'src-tauri\target\release\agentmirror-desktop.exe'
          if (-not (Test-Path $binary)) {
            throw "Portable binary was not found: $binary"
          }
          Copy-Item $binary (Join-Path $portableDir 'AgentMirror.exe')
          Compress-Archive -Path (Join-Path $portableDir 'AgentMirror.exe') `
            -DestinationPath (Join-Path $release "AgentMirror-v${version}-windows-x64.zip") -Force

          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and '${{ inputs.tag }}') {
            '${{ inputs.tag }}'
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            "v$version"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Clean and smoke-test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem (Join-Path $PWD 'release\AgentMirror_*_x64-setup.exe') -File |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Staged NSIS installer was not found.'
          }
          .\scripts\windows-release-smoke.ps1 -InstallerPath $installer.FullName

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release
          if-no-files-found: error

  macos-release:
    runs-on: macos-14
    outputs:
      tag: ${{ steps.artifacts.outputs.tag }}
    steps:
      - name: Check out repository and pinned core
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Select pinned Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Run Swift package tests
        run: swift test --package-path native --parallel

      - name: Run Swift shell checks
        run: bash native/Tests/ShellTests/run-checks.sh

      - name: Build frontend
        run: npm run build

      - name: Build production AgentMirror.app
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          VERSION="$version" OUT_ROOT="$RUNNER_TEMP/agentmirror-native" ./scripts/build-swift-app.sh

      - name: Create and verify macOS DMG
        id: artifacts
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          release="$GITHUB_WORKSPACE/release"
          app="$RUNNER_TEMP/agentmirror-native/AgentMirror.app"
          dmg="$release/AgentMirror-v${version}-macOS-arm64.dmg"
          mkdir -p "$release"
          test -d "$app"
          ./scripts/create-dmg.sh "$app" "$dmg"

          mounted=0
          mount_point=''
          cleanup() {
            if [[ "$mounted" -eq 1 && -n "$mount_point" ]]; then
              hdiutil detach "$mount_point" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          mount_output=$(hdiutil attach -nobrowse -readonly "$dmg")
          mount_point=$(printf '%s\n' "$mount_output" | awk '$NF ~ /^\/Volumes\// {print $NF; exit}')
          test -n "$mount_point"
          mounted=1
          test -d "$mount_point/AgentMirror.app"
          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = '/Applications'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mount_point/AgentMirror.app/Contents/Info.plist")" = 'com.agentmirror.desktop'
          file "$mount_point/AgentMirror.app/Contents/MacOS/AgentMirrorApp" | grep -q 'arm64'
          hdiutil detach "$mount_point" >/dev/null
          mounted=0

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && -n '${{ inputs.tag }}' ]]; then
            tag='${{ inputs.tag }}'
          elif [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - windows-release
      - macos-release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create checksums
        run: |
          set -euo pipefail
          test -n "$(find release -maxdepth 1 -type f -print -quit)"
          (cd release && sha256sum AgentMirror* | sort) > release/SHA256SUMS
          {
            echo '## Release artifacts'
            echo
            cat release/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.windows-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          body: |
            AgentMirror desktop release.

            - Windows: NSIS installer, MSI installer when produced, and a portable x64 ZIP.
            - Windows WSL2: local-direct mode can connect to the local agentmirrord WebSocket on port 9900 without pairing.
            - macOS: native Swift AppKit + WKWebView arm64 DMG. Open the DMG and drag `AgentMirror.app` to the `Applications` shortcut.

            Verify downloaded artifacts with the attached `SHA256SUMS` file.
