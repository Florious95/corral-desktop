name: Windows desktop

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - '.gitmodules'
      - 'deps/corral-core'
      - 'src-tauri/**'
      - 'scripts/verify-agentmirrord-resource.mjs'
      - 'src/**'
      - 'test/**'
      - 'native/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository and pinned core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Parse isolated Windows acceptance runner
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/windows-5090-client-e2e-gate.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

      - name: Run frontend tests
        continue-on-error: true
        run: npm test

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Tauri backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify bundled Linux WSL service
        run: node scripts/verify-agentmirrord-resource.mjs

      - name: Build Windows desktop application
        run: npm run tauri build -- --no-bundle
