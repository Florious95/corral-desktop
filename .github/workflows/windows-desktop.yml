name: Windows desktop

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - '.gitmodules'
      - 'deps/corral-core'
      - 'src-tauri/**'
      - 'scripts/verify-agentmirrord-resource.mjs'
      - 'src/**'
      - 'test/**'
      - 'native/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unix-frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository and pinned core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Tauri backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify bundled Linux WSL service
        run: node scripts/verify-agentmirrord-resource.mjs

      - name: Build Windows desktop application
        run: npm run tauri build -- --no-bundle

      - name: Verify release has no application console
        run: node scripts/verify-windows-subsystem.mjs
